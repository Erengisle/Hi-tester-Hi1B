<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historia – Självtester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f4f1ea;
      --surface: #ffffff;
      --ink:     #1c1f1d;
      --mute:    #7a7a76;
      --hair:    #ece8de;
      --accent:  #3a6b54;
      --warn:    #a86a3e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 28px 20px 48px;
      max-width: 860px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .header-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 500;
      margin-bottom: 4px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .header-meta { font-size: 11px; color: var(--mute); text-align: right; }

    /* ── Områdesgrupp ── */
    .omrade-grupp { margin-bottom: 24px; }
    .omrade-rubrik {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 600;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--hair);
    }

    .kort-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .kort {
      background: var(--surface);
      border: 1px solid var(--hair);
      border-radius: 12px;
      padding: 16px 18px;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .kort:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(58,107,84,0.10);
    }
    .kort-id {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 500;
    }
    .kort-titel {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .kort-meta {
      font-size: 11px;
      color: var(--mute);
      margin-top: 2px;
    }
    .kort-pil {
      font-size: 16px;
      color: var(--accent);
      margin-top: auto;
      padding-top: 8px;
    }
  </style>
</head>
<body>

<?
  // Gruppera formulär per område
  var perOmrade = {};
  var omradenOrdning = [];
  for (var i = 0; i < formularer.length; i++) {
    var f = formularer[i];
    if (!perOmrade[f.omrade]) {
      perOmrade[f.omrade] = [];
      omradenOrdning.push(f.omrade);
    }
    perOmrade[f.omrade].push(f);
  }
?>

<div class="header">
  <div>
    <div class="header-label">Historia · Hi1B</div>
    <h1>Välj ett självtest</h1>
  </div>
  <div class="header-meta"><?= formularer.length ?> formulär</div>
</div>

<? for (var o = 0; o < omradenOrdning.length; o++) {
  var om = omradenOrdning[o];
  var lista = perOmrade[om];
?>
<div class="omrade-grupp">
  <div class="omrade-rubrik"><?= om ?></div>
  <div class="kort-grid">
    <? for (var i = 0; i < lista.length; i++) {
      var f = lista[i];
    ?>
    <a class="kort" href="<?= f.lank ?>" target="_blank" rel="noopener">
      <div class="kort-id"><?= f.testId ?></div>
      <div class="kort-titel"><?= f.omrade ?></div>
      <div class="kort-meta"><?= f.antal ?> frågor</div>
      <div class="kort-pil">→</div>
    </a>
    <? } ?>
  </div>
</div>
<? } ?>

</body>
</html>
